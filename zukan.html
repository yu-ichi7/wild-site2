    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<body>

    <header class="page-header">
        <nav>
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="zukan.html">図鑑</a></li>
                <li><a href="gallery.html">ギャラリー</a></li>

        </nav>

    <main class="page-content">
        <h1>図鑑</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="鳥の名前で検索...">
        </div>
        <div class="bird-grid">
            <!-- Bird Card 1 -->
            <div class="bird-card">
                <img src="https://source.unsplash.com/400x300/?sparrow" alt="スズメ">
                <div class="bird-card-content">
                    <h3>スズメ</h3>
                    <p>学名: <i>Passer montanus</i></p>
                    <p>市街地から山地まで、人の生活圏の近くでよく見られる小型の鳥。</p>
                </div>
            </div>
            <!-- Bird Card 2 -->
            <div class="bird-card">
                <img src="https://source.unsplash.com/400x300/?crow" alt="ハシブトガラス">
                <div class="bird-card-content">
                    <h3>ハシブトガラス</h3>
                    <p>学名: <i>Corvus macrorhynchos</i></p>
                    <p>都市部でよく見られる大型の黒い鳥。くちばしが太いのが特徴。</p>
                </div>
            </div>
            <!-- 今後、ここに鳥のカードを追加していきます -->
        </div>
    </main>
