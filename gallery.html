<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ギャラリー - 野鳥と出会う日々</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="page-header">
        <nav>
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="zukan.html">図鑑</a></li>
                <li><a href="gallery.html">ギャラリー</a></li>
                <li><a href="column.html">コラム</a></li>
                <li><a href="blog.html">ブログ</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <h1 class="page-title">野鳥ギャラリー</h1>
        
        <!-- フィルター -->
        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="sparrow">スズメ</button>
            <button class="filter-btn" data-filter="pigeon">ハト</button>
            <button class="filter-btn" data-filter="crow">カラス</button>
            <button class="filter-btn" data-filter="other">その他</button>
        </div>

        <!-- 画像グリッド -->
        <div class="gallery-grid" id="gallery-grid">
            <!-- ここにJavaScriptで画像が挿入されます -->
        </div>

        <!-- ページネーション -->
        <div class="pagination">
            <button class="page-btn" id="prev-page">前へ</button>
            <div class="page-numbers" id="page-numbers"></div>
            <button class="page-btn" id="next-page">次へ</button>
        </div>

        <!-- モーダル -->
        <div class="modal" id="image-modal">
            <span class="close-btn">&times;</span>
            <img class="modal-content" id="modal-image">
            <div class="modal-caption" id="modal-caption"></div>
            <div class="modal-nav">
                <button class="nav-btn" id="prev-img">❮</button>
                <button class="nav-btn" id="next-img">❯</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 野鳥と出会う日々. All Rights Reserved.</p>
    </footer>

    <script src="gallery.js"></script>
</body>
</html>
